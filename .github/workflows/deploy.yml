# Deploys the built site to GitHub Pages on every push to main.
# The site is served from the repository path
# (https://elabbarMohamedAmine.github.io/portfolio/), which works because
# vite.config.ts builds with a relative base.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a queued run replace the one already waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # actions/configure-pages reads the Pages site record and fails with
      # "Get Pages site failed" (404) when that record does not exist yet.
      # Choosing "GitHub Actions" as the build source in the repo settings sets
      # the Pages flag but does not create the site, so it is created here.
      # This is idempotent: the API returns 422 if the site already exists.
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/pages" >/dev/null 2>&1; then
            echo "Pages site already exists, nothing to create."
          else
            echo "No Pages site found. Creating one with build type 'workflow'."
            gh api --method POST "repos/${REPO}/pages" -f build_type=workflow
            echo "Pages site created."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
